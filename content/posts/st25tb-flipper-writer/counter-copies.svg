<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" role="img" aria-labelledby="title desc">
  <title id="title">One counter block backed by two internal sub-counters</title>
  <desc id="desc">A counter block contains sub-counters CNTA and CNTB. Reads return their minimum. A valid decrement overwrites the larger sub-counter, so successive writes alternate between the two copies.</desc>
  <defs>
    <style>
      .title{font-family:monospace;font-size:30px;font-weight:700;fill:#f8fafc}
      .heading{font-family:monospace;font-size:20px;font-weight:700;fill:#f8fafc}
      .label{font-family:monospace;font-size:17px;font-weight:700;fill:#f8fafc}
      .small{font-family:monospace;font-size:15px;fill:#cbd5e1}
      .panel{fill:#111c2f;stroke:#334155;stroke-width:2.5}
      .copy{fill:#172033;stroke:#64748b;stroke-width:2.5}
      .cyan{fill:#164e63;stroke:#22d3ee;stroke-width:2.5}
      .green{fill:#064e3b;stroke:#34d399;stroke-width:2.5}
      .gold{fill:#422006;stroke:#fbbf24;stroke-width:2.5}
      .arrow{fill:none;stroke:#64748b;stroke-width:3}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
    </marker>
    <marker id="gold-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="900" height="590" rx="18" fill="#0f172a"/>
  <text x="450" y="43" text-anchor="middle" class="title">Inside one counter block</text>

  <!-- Generic logical architecture. -->
  <rect x="25" y="66" width="850" height="214" rx="14" class="panel"/>
  <text x="52" y="101" class="heading">BLOCK 5 OR BLOCK 6</text>

  <rect x="85" y="122" width="230" height="58" rx="9" class="copy"/>
  <text x="200" y="158" text-anchor="middle" class="heading">CNTA · 32 BITS</text>

  <rect x="85" y="205" width="230" height="58" rx="9" class="copy"/>
  <text x="200" y="241" text-anchor="middle" class="heading">CNTB · 32 BITS</text>

  <rect x="315" y="149.5" width="56.5" height="3" fill="#64748b"/>
  <rect x="368.5" y="151" width="3" height="23.5" fill="#64748b"/>
  <rect x="370" y="171.5" width="60" height="3" fill="#64748b"/>
  <polygon points="430,173 414,164 414,182" fill="#64748b"/>
  <rect x="315" y="232.5" width="56.5" height="3" fill="#64748b"/>
  <rect x="368.5" y="211.5" width="3" height="23.5" fill="#64748b"/>
  <rect x="370" y="211.5" width="60" height="3" fill="#64748b"/>
  <polygon points="430,213 414,204 414,222" fill="#64748b"/>

  <rect x="430" y="151" width="130" height="86" rx="10" class="gold"/>
  <text x="495" y="202" text-anchor="middle" class="heading">MIN</text>
  <rect x="560" y="192.5" width="130" height="3" fill="#64748b"/>
  <polygon points="690,194 674,185 674,203" fill="#64748b"/>
  <rect x="690" y="160" width="130" height="68" rx="10" class="green"/>
  <text x="755" y="201" text-anchor="middle" class="label">READ</text>

  <!-- Two writes show how the larger copy is replaced in turn. -->
  <rect x="25" y="300" width="850" height="264" rx="14" class="panel"/>
  <text x="52" y="335" class="heading">TWO CONSECUTIVE DECREMENTS</text>

  <g transform="translate(55 365)">
    <rect x="0" y="0" width="205" height="151" rx="12" class="copy"/>
    <text x="102" y="32" text-anchor="middle" class="small">START</text>
    <rect x="20" y="50" width="76" height="53" rx="7" class="copy"/>
    <text x="58" y="82" text-anchor="middle" class="label">A 100</text>
    <rect x="109" y="50" width="76" height="53" rx="7" class="copy"/>
    <text x="147" y="82" text-anchor="middle" class="label">B 99</text>
    <text x="102" y="132" text-anchor="middle" class="label" fill="#34d399">read 99</text>
  </g>

  <rect x="270" y="438.5" width="59" height="3" fill="#fbbf24"/>
  <polygon points="338,440 322,431 322,449" fill="#fbbf24"/>
  <text x="304" y="424" text-anchor="middle" class="small" fill="#fbbf24">write 98</text>

  <g transform="translate(348 365)">
    <rect x="0" y="0" width="205" height="151" rx="12" class="copy"/>
    <text x="102" y="32" text-anchor="middle" class="small">A WAS LARGER</text>
    <rect x="20" y="50" width="76" height="53" rx="7" class="gold"/>
    <text x="58" y="82" text-anchor="middle" class="label">A 98</text>
    <rect x="109" y="50" width="76" height="53" rx="7" class="copy"/>
    <text x="147" y="82" text-anchor="middle" class="label">B 99</text>
    <text x="102" y="132" text-anchor="middle" class="label" fill="#34d399">read 98</text>
  </g>

  <rect x="563" y="438.5" width="59" height="3" fill="#fbbf24"/>
  <polygon points="631,440 615,431 615,449" fill="#fbbf24"/>
  <text x="597" y="424" text-anchor="middle" class="small" fill="#fbbf24">write 97</text>

  <g transform="translate(641 365)">
    <rect x="0" y="0" width="205" height="151" rx="12" class="copy"/>
    <text x="102" y="32" text-anchor="middle" class="small">B WAS LARGER</text>
    <rect x="20" y="50" width="76" height="53" rx="7" class="copy"/>
    <text x="58" y="82" text-anchor="middle" class="label">A 98</text>
    <rect x="109" y="50" width="76" height="53" rx="7" class="gold"/>
    <text x="147" y="82" text-anchor="middle" class="label">B 97</text>
    <text x="102" y="132" text-anchor="middle" class="label" fill="#34d399">read 97</text>
  </g>
</svg>
