<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" role="img" aria-labelledby="title desc">
  <title id="title">From a function-like block to its fingerprint</title>
  <desc id="desc">The operands are discarded from a MIPS function-like block. Repeated instruction mnemonics are counted to produce a dictionary containing the function fingerprint.</desc>
  <defs>
    <style>
      .title{font-family:monospace;font-size:30px;font-weight:700;fill:#f8fafc}
      .heading{font-family:monospace;font-size:20px;font-weight:700;fill:#f8fafc}
      .label{font-family:monospace;font-size:18px;font-weight:700;fill:#f8fafc}
      .mnemonic{font-family:monospace;font-size:18px;font-weight:700;fill:#22d3ee}
      .operand{font-family:monospace;font-size:18px;fill:#94a3b8}
      .small{font-family:monospace;font-size:16px;fill:#cbd5e1}
      .value{font-family:monospace;font-size:18px;font-weight:700;fill:#fbbf24}
      .panel{fill:#111c2f;stroke:#334155;stroke-width:2}
      .block{fill:#164e63;stroke:#22d3ee;stroke-width:3}
      .row{fill:#1e293b;stroke:#475569;stroke-width:1.5}
      .dictionary{fill:#064e3b;stroke:#34d399;stroke-width:3}
      .entry{fill:#172033;stroke:#34d399;stroke-width:2}
      .gold{fill:#fbbf24}
    </style>
  </defs>

  <rect width="900" height="680" rx="18" fill="#0f172a"/>
  <text x="450" y="48" text-anchor="middle" class="title">From block to fingerprint</text>

  <!-- Function-like block. -->
  <rect x="10" y="78" width="355" height="590" rx="14" class="panel"/>
  <text x="187.5" y="116" text-anchor="middle" class="heading">FUNCTION-LIKE BLOCK</text>
  <rect x="25" y="138" width="325" height="500" rx="10" class="block"/>

  <g transform="translate(40 160)">
    <rect x="0" y="0" width="295" height="44" rx="5" class="row"/>
    <text x="20" y="29" class="mnemonic">addiu</text><text x="110" y="29" class="operand">sp, sp, -32</text>
    <rect x="0" y="51" width="295" height="44" rx="5" class="row"/>
    <text x="20" y="80" class="mnemonic">sw</text><text x="110" y="80" class="operand">ra, 28(sp)</text>
    <rect x="0" y="102" width="295" height="44" rx="5" class="row"/>
    <text x="20" y="131" class="mnemonic">jal</text><text x="110" y="131" class="operand">8020f518</text>
    <rect x="0" y="153" width="295" height="44" rx="5" class="row"/>
    <text x="20" y="182" class="mnemonic">sw</text><text x="110" y="182" class="operand">a1, 16(sp)</text>
    <rect x="0" y="204" width="295" height="44" rx="5" class="row"/>
    <text x="20" y="233" class="mnemonic">lw</text><text x="110" y="233" class="operand">a1, 16(sp)</text>
    <rect x="0" y="255" width="295" height="44" rx="5" class="row"/>
    <text x="20" y="284" class="mnemonic">sw</text><text x="110" y="284" class="operand">v0, 384(a1)</text>
    <rect x="0" y="306" width="295" height="44" rx="5" class="row"/>
    <text x="20" y="335" class="mnemonic">lw</text><text x="110" y="335" class="operand">ra, 28(sp)</text>
    <rect x="0" y="357" width="295" height="44" rx="5" class="row"/>
    <text x="20" y="386" class="mnemonic">jr</text><text x="110" y="386" class="operand">ra</text>
    <rect x="0" y="408" width="295" height="44" rx="5" class="row"/>
    <text x="20" y="437" class="mnemonic">addiu</text><text x="110" y="437" class="operand">sp, sp, 32</text>
  </g>

  <!-- Transformation. -->
  <text x="450" y="306" text-anchor="middle" class="small">discard operands</text>
  <rect x="365" y="345" width="155" height="5" class="gold"/>
  <polygon points="535,347 517,336 517,358" class="gold"/>
  <text x="450" y="390" text-anchor="middle" class="small">count mnemonics</text>

  <!-- Resulting dictionary. -->
  <rect x="535" y="78" width="355" height="590" rx="14" class="panel"/>
  <text x="712.5" y="116" text-anchor="middle" class="heading">FINGERPRINT DICTIONARY</text>
  <rect x="550" y="138" width="325" height="500" rx="10" class="dictionary"/>
  <g transform="translate(575 196)">
    <rect x="0" y="0" width="275" height="68" rx="8" class="entry"/>
    <text x="148" y="43" text-anchor="end" class="label">addiu</text><text x="170" y="43" class="value">2</text>
    <rect x="0" y="79" width="275" height="68" rx="8" class="entry"/>
    <text x="132" y="122" text-anchor="end" class="label">sw</text><text x="154" y="122" class="value">3</text>
    <rect x="0" y="158" width="275" height="68" rx="8" class="entry"/>
    <text x="137.5" y="201" text-anchor="end" class="label">jal</text><text x="159.5" y="201" class="value">1</text>
    <rect x="0" y="237" width="275" height="68" rx="8" class="entry"/>
    <text x="132" y="280" text-anchor="end" class="label">lw</text><text x="154" y="280" class="value">2</text>
    <rect x="0" y="316" width="275" height="68" rx="8" class="entry"/>
    <text x="132" y="359" text-anchor="end" class="label">jr</text><text x="154" y="359" class="value">1</text>
  </g>
</svg>
